apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/instance: k8s
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: milvus-prometheus-rules
  namespace: monitoring
spec:
  groups:
  - name: milvus
    rules:
    - alert: MilvusProxyDown
      expr: up{job="milvus"} == 0
      for: 15m
      labels:
        severity: critical
        alertgroup: milvus
      annotations:
        summary: Milvus proxy down
        description: Milvus scrape target is down (job=milvus)

    - alert: MilvusFlushFailed
      expr: sum(increase(milvus_proxy_req_count{function_name="Flush",status!~"success|total"}[5m])) > 30
      for: 5m
      labels:
        severity: warning
        alertgroup: milvus
      annotations:
        summary: Milvus flush failures above threshold
        description: "{{ $value | humanize }} failed Flush requests in last 5m (threshold 30)"

    - alert: MilvusFlushFailedCritical
      expr: sum(increase(milvus_proxy_req_count{function_name="Flush",status!~"success|total"}[5m])) > 100
      for: 5m
      labels:
        severity: critical
        alertgroup: milvus
      annotations:
        summary: Milvus flush failures critical
        description: "{{ $value | humanize }} failed Flush requests in last 5m (threshold 100)"

    - alert: MilvusFlushRateLimited
      expr: sum(increase(milvus_proxy_rate_limit_req_count{msg_type="DDLFlush"}[5m])) > 55
      for: 5m
      labels:
        severity: warning
        alertgroup: milvus
      annotations:
        summary: Milvus DDL Flush rate limited
        description: "{{ $value | humanize }} DDLFlush rate limit hits in last 5m (threshold 55)"

    - alert: MilvusCheckpointLagHigh
      expr: (time() - milvus_datacoord_channel_checkpoint_unix_seconds{namespace="milvus"}) > 900
      for: 10m
      labels:
        severity: warning
        alertgroup: milvus
      annotations:
        summary: Milvus recovery checkpoint lag high
        description: 'Channel {{ $labels.channel_name }} recovery checkpoint is {{ $value | humanizeDuration }} behind'

    - alert: MilvusCheckpointLagCritical
      expr: (time() - milvus_datacoord_channel_checkpoint_unix_seconds{namespace="milvus"}) > 1800
      for: 10m
      labels:
        severity: critical
        alertgroup: milvus
      annotations:
        summary: Milvus recovery checkpoint lag critical
        description: 'Channel {{ $labels.channel_name }} recovery checkpoint is {{ $value | humanizeDuration }} behind'

    - alert: MilvusDatanodeConsumptionLagHigh
      expr: max by (node_id, collection_id) (milvus_datanode_consume_tt_lag_ms{namespace="milvus"}) > 30000
      for: 5m
      labels:
        severity: warning
        alertgroup: milvus
      annotations:
        summary: Milvus DataNode consumption stalled
        description: 'Collection {{ $labels.collection_id }} consumption is {{ $value | humanize }}ms behind'

    - alert: MilvusMutationLatencyHigh
      expr: |
        (histogram_quantile(0.95, sum by (le) (rate(milvus_proxy_mutation_latency_bucket[5m]))) > 5000)
        and (sum(increase(milvus_proxy_mutation_latency_count[5m])) >= 5)
      for: 5m
      labels:
        severity: warning
        alertgroup: milvus
      annotations:
        summary: Milvus mutation latency p95 high
        description: p95 mutation latency {{ $value | humanize }}ms (threshold 5000ms, min 5 req)

    - alert: MilvusSearchLatencyHigh
      expr: |
        (histogram_quantile(0.95, sum by (le) (rate(milvus_proxy_sq_latency_bucket{query_type="search"}[5m]))) > 5000)
        and (sum(increase(milvus_proxy_sq_latency_count{query_type="search"}[5m])) >= 5)
      for: 5m
      labels:
        severity: warning
        alertgroup: milvus
      annotations:
        summary: Milvus search latency p95 high
        description: p95 search latency {{ $value | humanize }}ms (threshold 5000ms, min 5 req)

    - alert: MilvusQueryLatencyHigh
      expr: |
        (histogram_quantile(0.95, sum by (le) (rate(milvus_proxy_sq_latency_bucket{query_type="query"}[5m]))) > 1500)
        and (sum(increase(milvus_proxy_sq_latency_count{query_type="query"}[5m])) >= 5)
      for: 5m
      labels:
        severity: warning
        alertgroup: milvus
      annotations:
        summary: Milvus query latency p95 high
        description: p95 query latency {{ $value | humanize }}ms (threshold 1500ms, min 5 req)

    - alert: MilvusSlowQueriesDetected
      expr: sum(increase(milvus_proxy_slow_query_count[5m])) > 0
      for: 5m
      labels:
        severity: warning
        alertgroup: milvus
      annotations:
        summary: Milvus slow queries detected
        description: "{{ $value | humanize }} slow queries in last 5m"

  - name: milvus-etcd
    rules:
    # Prometheus is sharded, so count members via kube-state-metrics, not per-shard scrape targets.
    - alert: MilvusEtcdMemberDown
      expr: kube_statefulset_status_replicas_ready{namespace="milvus",statefulset="milvus-cluster-etcd"} < 3
      for: 5m
      labels:
        severity: warning
        alertgroup: milvus
      annotations:
        summary: Milvus etcd member down
        description: "Only {{ $value }} of 3 etcd members are ready for 5m; the cluster tolerates one member down."

    - alert: MilvusEtcdQuorumLost
      expr: kube_statefulset_status_replicas_ready{namespace="milvus",statefulset="milvus-cluster-etcd"} < 2
      for: 1m
      labels:
        severity: critical
        alertgroup: milvus
      annotations:
        summary: Milvus etcd quorum lost
        description: "Only {{ $value }} of 3 etcd members are ready; Milvus metadata reads and writes will fail."

    - alert: MilvusEtcdScrapeDown
      expr: up{job="milvus/milvus-cluster-etcd"} == 0
      for: 10m
      labels:
        severity: warning
        alertgroup: milvus
      annotations:
        summary: Milvus etcd metrics not scrapeable
        description: "Prometheus can't scrape etcd member {{ $labels.pod }}; etcd alerts for it are blind."

    - alert: MilvusEtcdNoLeader
      expr: etcd_server_has_leader{job="milvus/milvus-cluster-etcd"} == 0
      for: 1m
      labels:
        severity: critical
        alertgroup: milvus
      annotations:
        summary: Milvus etcd member has no leader
        description: "etcd member {{ $labels.pod }} has had no leader for 1m."

    - alert: MilvusEtcdFrequentLeaderChanges
      expr: max(increase(etcd_server_leader_changes_seen_total{job="milvus/milvus-cluster-etcd"}[1h])) > 4
      labels:
        severity: warning
        alertgroup: milvus
      annotations:
        summary: Milvus etcd leader changing frequently
        description: "{{ $value | humanize }} leader changes in the last hour; check etcd disk latency and node stability."

    - alert: MilvusEtcdWALFsyncSlow
      expr: histogram_quantile(0.99, sum by (pod, le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket{job="milvus/milvus-cluster-etcd"}[5m]))) > 0.5
      for: 10m
      labels:
        severity: warning
        alertgroup: milvus
      annotations:
        summary: Milvus etcd WAL fsync slow
        description: "etcd {{ $labels.pod }} WAL fsync p99 is {{ $value | humanizeDuration }} (threshold 500ms)."

    - alert: MilvusEtcdBackendCommitSlow
      expr: histogram_quantile(0.99, sum by (pod, le) (rate(etcd_disk_backend_commit_duration_seconds_bucket{job="milvus/milvus-cluster-etcd"}[5m]))) > 0.25
      for: 10m
      labels:
        severity: warning
        alertgroup: milvus
      annotations:
        summary: Milvus etcd backend commit slow
        description: "etcd {{ $labels.pod }} backend commit p99 is {{ $value | humanizeDuration }} (threshold 250ms)."

    - alert: MilvusEtcdProposalsFailing
      expr: max(increase(etcd_server_proposals_failed_total{job="milvus/milvus-cluster-etcd"}[1h])) > 5
      for: 5m
      labels:
        severity: warning
        alertgroup: milvus
      annotations:
        summary: Milvus etcd proposals failing
        description: "{{ $value | humanize }} failed etcd proposals in the last hour."

    - alert: MilvusEtcdDatabaseNearQuota
      expr: max by (pod) (etcd_mvcc_db_total_size_in_bytes{job="milvus/milvus-cluster-etcd"} / etcd_server_quota_backend_bytes{job="milvus/milvus-cluster-etcd"}) > 0.8
      for: 10m
      labels:
        severity: warning
        alertgroup: milvus
      annotations:
        summary: Milvus etcd database near quota
        description: "etcd {{ $labels.pod }} database is at {{ $value | humanizePercentage }} of its quota; etcd goes read-only when full."

